rog_map:
  # 地图基本参数
  resolution: 0.05                      # 概率地图分辨率(m)
  inflation_resolution: 0.1            # 膨胀分辨率(m)
  inflation_step: 1                    # 膨胀步长
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [30, 30, 4]               # 地图大小 [x, y, z] (m) - 注意x方向较小
  # If the map rolling is disable, the map origin [m] should be set.
  fix_map_origin: [0, 0, 0]          # 固定地图原点
  frontier_extraction_en: false

  # Virtual ceil and ground
  virtual_ceil_height: 5               # 天花板高度(m)
  virtual_ground_height: -1.53 #-0.5          # 地面高度(m)

  load_pcd_en: false

  # ROS 回调配置（本节点经 MaMap::update_cloud 手动喂数据，不依赖 ROGMap 自带订阅；
  # odom_timeout 用于点云回调的“里程计新鲜度”过滤，默认 0.05s 太严——odom 稍慢就丢所有点云帧）
  ros_callback:
    enable: true
    cloud_topic: "/lio/cloud_world"
    odom_topic: "/lio/base_odom"
    odom_timeout: 0.5

  map_sliding:
    enable: true                      # 禁用滑动窗口（因为已固定原点）
    threshold: 0.3

  esdf:
    enable: false
    resolution: 0.3                    # 必须 >= rog_map.resolution
    # The range of esdf around the odom [m]
    local_update_box: [15, 15, 3]      # 增大ESDF更新范围以匹配地图

  visualization:
    enable: true
    time_rate: 30                       # 可视化更新
    range: [100, 60, 4]                 # 可视化范围(m)
    pub_unknown_map_en: true

  # Intensity filter for input point cloud
  intensity_thresh: -10                # -10表示不进行强度滤波
  point_filt_num: 1


  forget_threshold: -0.6                 # 遗忘阈值(s)，小于等于0表示不进行遗忘衰减

  # Terrain analysis (通过性分析)
  terrain:
    kernel_size: 5                      # 中值滤波核大小
    max_step_height: 0.15               # 台阶/墙体最小高度差（触发间隙分析）
    robot_height: 0.3                   # 机器人安全通行所需最小垂直间隙
    steep_threshold: 0.17               # 陡坡阈值

  # 2D grid map (A* 规划用)。边界按原点向四个方向的延伸量设置：
  # x ∈ [-x_left, +x_right], y ∈ [-y_left, +y_right]，即 x,-x,y,-y
  grid_map:
    x_left: 6.0                      # 原点向左（-x）延伸 (m)
    x_right: 22.0                      # 原点向右（+x）延伸 (m)
    y_left: 8.0                        # 原点向左（-y）延伸 (m)
    y_right: 8.0                       # 原点向右（+y）延伸 (m)
    resolution: 0.05                   # 2D 栅格分辨率(m)


  # Probabilistic update - 必须启用才能构建地图
  raycasting:
    enable: true                       # 改为true，启用射线投射更新地图
    batch_update_size: 1
    local_update_box: [10, 10, 4]      # 局部更新范围(m)
    # The range of raycasting [m]
    ray_range: [0.5, 30]               # 射线范围，根据LiDAR实际探测距离调整

    # 概率参数
    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ: 0.85
    p_hit: 0.9
    p_max: 0.98
    # 未知区域阈值
    unk_thresh: 1.0